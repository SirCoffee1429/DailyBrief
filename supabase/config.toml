
[functions.categorize-recipe]
enabled = true
verify_jwt = true
import_map = "./functions/categorize-recipe/deno.json"
entrypoint = "./functions/categorize-recipe/index.ts"

[functions.process-banquets]
enabled = true
verify_jwt = false

[functions.process-beo]
enabled = true
verify_jwt = false

[functions.process-sales-data]
enabled = true
verify_jwt = false

[functions.process-features]
enabled = true
verify_jwt = false

[functions.process-schedule]
enabled = true
verify_jwt = false

# Postmark cannot send a Supabase JWT, so this is false for the same reason
# process-sales-data and process-banquets are. The endpoint is gated by a sender
# allowlist, a subject keyword and a PDF requirement — and, decisively, by the
# review queue: an emailed BEO never reaches a live event without someone
# pressing Approve. BEO_WEBHOOK_SECRET layers HTTP Basic on top if ever set.
[functions.receive-beo-email]
enabled = true
verify_jwt = false