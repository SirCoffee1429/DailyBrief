
[functions.categorize-recipe]
enabled = true
verify_jwt = true
import_map = "./functions/categorize-recipe/deno.json"
entrypoint = "./functions/categorize-recipe/index.ts"

[functions.process-banquets]
enabled = true
verify_jwt = false

[functions.process-beo]
enabled = true
verify_jwt = false

[functions.process-sales-data]
enabled = true
verify_jwt = false

[functions.process-features]
enabled = true
verify_jwt = false

[functions.process-schedule]
enabled = true
verify_jwt = false

# Postmark cannot send a Supabase JWT, so this is false for the same reason
# process-sales-data and process-banquets are. The endpoint accepts any message
# carrying a PDF: its Postmark inbound address is a random hash known only to
# the one person who redirects mail to it, so a sender or subject filter was
# only ever checking a property of mail that is already ours. What protects
# live event data is the review queue — an emailed BEO never reaches an event
# without someone pressing Approve. BEO_WEBHOOK_SECRET layers HTTP Basic on top
# if it is ever set.
[functions.receive-beo-email]
enabled = true
verify_jwt = false